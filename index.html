<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under The Rain</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    background:radial-gradient(circle at center,#111 0%,#000 80%);
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Segoe UI, sans-serif;
    color:white;
}

/* Rain */
.rain{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.drop{
    position:absolute;
    width:2px;
    height:18px;
    background:rgba(255,255,255,0.25);
    animation:fall linear infinite;
}

@keyframes fall{
    0%{transform:translateY(-100vh);}
    100%{transform:translateY(100vh);}
}

/* Scene container */
.scene{
    position:relative;
    width:400px;
    height:400px;
}

/* Tree */
.tree{
    position:absolute;
    bottom:120px;
    left:60px;
    width:20px;
    height:200px;
    background:#2b1d0e;
}

.tree::before{
    content:"";
    position:absolute;
    bottom:160px;
    left:-80px;
    width:180px;
    height:140px;
    background:#0b1a0b;
    border-radius:50%;
}

/* Girl */
.girl{
    position:absolute;
    bottom:80px;
    left:180px;
    width:60px;
    height:100px;
}

.head{
    width:40px;
    height:40px;
    background:#222;
    border-radius:50%;
    margin:auto;
    position:relative;
}

.body{
    width:30px;
    height:50px;
    background:#111;
    margin:5px auto;
    border-radius:15px;
}

.legs{
    width:50px;
    height:20px;
    background:#111;
    margin:auto;
    border-radius:20px;
}

/* Subtle shaking (cold effect) */
@keyframes shake{
    0%,100%{transform:translateX(0);}
    50%{transform:translateX(2px);}
}

.girl{
    animation:shake 3s infinite ease-in-out;
}

/* Dialogue bubble */
.dialogue{
    position:absolute;
    bottom:170px;
    left:220px;
    background:rgba(0,0,0,0.7);
    padding:12px;
    border-radius:15px;
    max-width:200px;
    font-size:14px;
    opacity:0;
    transition:opacity 0.8s ease;
}

.dialogue::after{
    content:"";
    position:absolute;
    bottom:-10px;
    left:20px;
    border-width:10px;
    border-style:solid;
    border-color:rgba(0,0,0,0.7) transparent transparent transparent;
}

button{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 20px;
    border:none;
    border-radius:20px;
    background:#444;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#666;
}
</style>
</head>
<body>

<div class="rain" id="rain"></div>

<div class="scene">
    <div class="tree"></div>

    <div class="girl">
        <div class="head"></div>
        <div class="body"></div>
        <div class="legs"></div>
    </div>

    <div class="dialogue" id="dialogue"></div>

    <button onclick="nextMessage()">Let Her Speak</button>
</div>

<script>
/* Create Rain */
const rain = document.getElementById("rain");
for(let i=0;i<150;i++){
    let drop=document.createElement("div");
    drop.classList.add("drop");
    drop.style.left=Math.random()*100+"vw";
    drop.style.animationDuration=(Math.random()*1+0.5)+"s";
    drop.style.opacity=Math.random();
    rain.appendChild(drop);
}

/* Messages */
const messages=[
"She was just tired...",
"I kept searching for a love that felt safe.",
"You always give up on me...",
"Maybe I was never enough.",
"I just wanted someone to stay.",
"I am so tired of fighting alone..."
];

let index=0;

/* Speech + text */
function speak(text){
    const speech=new SpeechSynthesisUtterance(text);
    speech.rate=0.9;
    speech.pitch=0.8;
    speech.volume=1;
    window.speechSynthesis.speak(speech);
}

function nextMessage(){
    if(index>=messages.length) return;

    const box=document.getElementById("dialogue");
    box.style.opacity=1;
    box.innerText=messages[index];
    speak(messages[index]);
    index++;
}
</script>

</body>
</html>
